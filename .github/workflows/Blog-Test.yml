name: Blog Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup Docker Compose
      run: docker composeup -d
    - name: Run Tests
      run: docker exec sh -c "flake8 && pytest ."
