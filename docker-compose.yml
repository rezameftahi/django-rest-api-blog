
services:
  backend:
    build: .
    container_name: backend
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./core:/app
    ports:
      - "8000:8000"
    environment:
      - SECRET_KEY=test
      - DEBUG=True

  smtp4dev:
    image: rnwood/smtp4dev:v3
    restart: on-failure
    ports:
      - "5000:80"
      - "25:25"
      - "143:143"
      - "110:110"
    volumes:
      - smtp4dev-data:/smtp4dev
    environment:
      - ServerOptions__Urls=http://*:80
      - ServerOptions__HostName=smtp4dev

  master:
    image: locustio/locust
    ports:
      - "8089:8089"
    volumes:
      - ./core/locust:/mnt/locust
    command: >
      -f /mnt/locust/locustfile.py
      --master
      -H http://backend:8000

  worker:
    image: locustio/locust
    volumes:
      - ./core/locust:/mnt/locust
    command: >
      -f /mnt/locust/locustfile.py
      --worker
      --master-host master
    depends_on:
      - master
      - backend

volumes:
  smtp4dev-data:
