$kind: http-example
request:
  url: "{{baseUrl}}/category/"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
    - key: Authorization
      value: Basic <credentials>
      description: "Added as a part of security scheme: basic"
  body:
    type: json
    content: |-
      {
        "name": "string"
      }
response:
  statusCode: 201
  statusText: Created
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "name": "string",
        "id": 9749
      }
    $type: |-
      {
        "type": "object",
        "properties": {
          "name": {
            "type": "string",
            "minLength": 1,
            "maxLength": 250,
            "title": "Name"
          }
        },
        "required": [
          "name"
        ]
      }
order: 1000
