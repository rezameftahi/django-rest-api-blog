$kind: http-example
request:
  url: "{{baseUrl}}/category/"
  method: GET
  headers:
    - key: Accept
      value: application/json
    - key: Authorization
      value: Basic <credentials>
      description: "Added as a part of security scheme: basic"
  body:
    type: text
    content: ""
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      [
        {
          "name": "string",
          "id": 6459
        },
        {
          "name": "string",
          "id": 9155
        }
      ]
    $type: |-
      {
        "type": "array",
        "items": {
          "type": "object",
          "properties": {
            "name": {
              "type": "string",
              "minLength": 1,
              "maxLength": 250,
              "title": "Name"
            }
          },
          "required": [
            "name"
          ]
        }
      }
order: 1000
